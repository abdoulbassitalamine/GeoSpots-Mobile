name: geo_spots
description: GeoSpots - Unified Flutter application
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: ">=3.10.7 <4.0.0"
  flutter: ">=3.38.7"

dependencies:
  flutter:
    sdk: flutter

  collection: ^1.19.1
  intl: ^0.20.2
  path: ^1.9.1
  flutter_svg: ^2.2.0
  flutter_hooks: ^0.21.3
  hooks_riverpod: ^3.2.1
  riverpod_annotation: ^4.0.2
  go_router: ^17.0.1
  dio: ^5.9.0
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.3.4
  path_provider: ^2.1.5
  flutter_dotenv: ^6.0.0
  freezed_annotation: ^3.0.0
  json_annotation: ^4.10.0
  url_launcher: ^6.3.2
  permission_handler: ^12.0.1
  open_file: ^3.5.11
  file_picker: ^10.3.10
  device_info_plus: ^12.3.0
  package_info_plus: ^9.0.0
  simple_animations: ^5.2.0
  top_snackbar_flutter: ^3.3.0
  vibration: ^3.1.5
  dropdown_button2: ^2.3.9
  email_validator: ^3.0.0
  phone_numbers_parser: ^9.0.18
  logger: ^2.6.2
  flutter_native_splash: ^2.4.7
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  geolocator: ^14.0.2
  image_picker: ^1.2.1
  xml: ^6.6.1
  share_plus: ^12.0.1
  app_links: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.5.4
  go_router_builder: ^4.0.1
  freezed: ^3.0.6
  json_serializable: ^6.9.5
  riverpod_generator: ^4.0.3
  flutter_lints: ^6.0.0
  flutter_gen_runner: ^5.10.0
  flutter_launcher_icons: ^0.14.2

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/app_logo.png"
  min_sdk_android: 21


flutter_gen:
  output: lib/gen/
  line_length: 180
  parse_metadata: true

  # Optional
  integrations:
    flutter_svg: true

  assets:
    enabled: true
    outputs:
      package_parameter_enabled: false
      style: dot-delimiter
      class_name: GSIcons

  fonts:
    enabled: false

  colors:
    enabled: false


flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/icons/
    - assets/fonts/
    - env/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter/Inter_18pt-Regular.ttf
        - asset: assets/fonts/Inter/Inter_18pt-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter/Inter_18pt-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter/Inter_18pt-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter/Inter_18pt-Italic.ttf
          style: italic
        - asset: assets/fonts/Inter/Inter_18pt-BoldItalic.ttf
          weight: 700
          style: italic

    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/Playfair_Display/PlayfairDisplay-Regular.ttf
        - asset: assets/fonts/Playfair_Display/PlayfairDisplay-Bold.ttf
          weight: 700
